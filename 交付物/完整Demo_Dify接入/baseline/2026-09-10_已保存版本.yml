          : \"短期异地办公\"}.get(draft[\"travel_type\"], \"待修正\"),\n             \"事由：\"\
          \ + esc(draft[\"reason\"]), \"\",\n             \"| 段 | 出发城市 | 到达城市 | 出发日期\
          \ | 到达日期 | 交通工具 |\",\n             \"|---|---|---|---|---|---|\"]\n    for\
          \ index, trip in enumerate(draft[\"trips\"], 1):\n        values = [index,\
          \ trip[\"resolved_from\"][\"name\"], trip[\"resolved_to\"][\"name\"],\n\
          \                  trip[\"depart_date\"][\"value\"], trip[\"arrive_date\"\
          ][\"value\"], trip[\"resolved_transport\"][\"name\"]]\n        lines.append(\"\
          | \" + \" | \".join(esc(x) for x in values) + \" |\")\n    if checked[\"\
