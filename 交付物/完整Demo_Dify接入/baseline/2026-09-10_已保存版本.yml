        code: "import json\nimport hashlib\nfrom datetime import datetime, timedelta,\
          \ timezone\n\n\n# BEGIN GENERATED STATE CONTRACT\ndef empty_dialogue():\n\
          \    return {\"focus\": {\"draft_id\": \"\", \"revision\": 0, \"questions\"\
          : []}, \"recovery\": {}}\n\n\ndef validate_dialogue(dialogue):\n    if not\
          \ isinstance(dialogue, dict) or set(dialogue) != {\"focus\", \"recovery\"\
          }:\n        raise ValueError(\"对话状态结构错误，不能自动清空。\")\n    focus, recovery\
          \ = dialogue[\"focus\"], dialogue[\"recovery\"]\n    if not isinstance(focus,\
          \ dict) or set(focus) != {\"draft_id\", \"revision\", \"questions\"}:\n\
          \        raise ValueError(\"当前追问目标结构错误。\")\n    if not isinstance(focus[\"\
          draft_id\"], str) or type(focus[\"revision\"]) is not int or focus[\"revision\"\
          ] < 0:\n        raise ValueError(\"追问关联的草稿版本错误。\")\n    if not isinstance(focus[\"\
          questions\"], list) or len(focus[\"questions\"]) > 2:\n        raise ValueError(\"\
          当前问题应为最多两项的列表。\")\n    for question in focus[\"questions\"]:\n        if\
          \ not isinstance(question, dict) or set(question) != {\"id\", \"target\"\
          , \"field\", \"question\"} or not all(isinstance(v, str) for v in question.values()):\n\
          \            raise ValueError(\"当前问题的目标字段错误。\")\n    if not isinstance(recovery,\
          \ dict):\n        raise ValueError(\"恢复事项结构错误。\")\n    if not recovery:\n\
          \        return\n    text_keys = (\"id\", \"failed_query\", \"reference_date\"\
          , \"error_code\", \"error_path\", \"base_draft_id\", \"question\", \"scope\"\
          )\n    if not all(isinstance(recovery.get(k), str) for k in text_keys):\n\
          \        raise ValueError(\"恢复事项文本字段错误。\")\n    if not recovery[\"id\"].startswith(\"\
          Q-RECOVERY-\") or recovery[\"scope\"] not in {\"TURN\", \"TARGET\"}:\n \
          \       raise ValueError(\"恢复事项标识错误。\")\n    if not recovery[\"question\"\
          ].strip() or len(recovery[\"failed_query\"]) > 4000:\n        raise ValueError(\"\
          恢复事项内容为空或过长。\")\n    if type(recovery.get(\"base_revision\")) is not int\
          \ or recovery[\"base_revision\"] < 0:\n        raise ValueError(\"恢复事项草稿版本错误。\"\
          )\n    if type(recovery.get(\"failure_count\")) is not int or recovery[\"\
          failure_count\"] < 1:\n        raise ValueError(\"恢复次数错误。\")\n    if not\
          \ isinstance(recovery.get(\"targets\"), list) or len(recovery[\"targets\"\
          ]) > 20:\n        raise ValueError(\"恢复目标列表错误。\")\n    for target in recovery[\"\
          targets\"]:\n        if not isinstance(target, dict) or set(target) != {\"\
          trip_id\", \"field\"} or not all(isinstance(v, str) and v for v in target.values()):\n\
          \            raise ValueError(\"恢复目标结构错误。\")\n    if recovery[\"scope\"\
          ] == \"TARGET\" and not recovery[\"targets\"]:\n        raise ValueError(\"\
          按目标恢复缺少目标。\")\n    if not isinstance(recovery.get(\"recent_errors\"), list)\
          \ or not 1 <= len(recovery[\"recent_errors\"]) <= 3:\n        raise ValueError(\"\
          恢复诊断数量错误。\")\n    for error in recovery[\"recent_errors\"]:\n        if\
          \ not isinstance(error, dict) or not all(isinstance(error.get(k), str) for\
          \ k in (\"error_code\", \"error_path\")):\n            raise ValueError(\"\
          恢复诊断结构错误。\")\n# END GENERATED STATE CONTRACT\n\n\ndef main(query: str, cv_session:\
          \ str, demo_case: str,\n         demo_reference_date: str, run_id: str)\
          \ -> dict:\n    def encode(value):\n        return json.dumps(value, ensure_ascii=False,\
          \ separators=(\",\", \":\"))\n\n    case = str(demo_case or \"NORMAL\").strip()\n\
          \    cases = {\"NORMAL\", \"NO_PERMISSION\", \"OVERLAP\", \"CHECK_ERROR\"\
          , \"ACTIVITY_REQUIRED\"}\n    if case not in cases:\n        raise ValueError(\"\
          未知演示场景；请从入口下拉列表选择。\")\n    query = str(query or \"\").strip()\n    if not\
          \ query or len(query) > 4000:\n        raise ValueError(\"输入须为 1～4000 个字符。\"\
          )\n    now = datetime.now(timezone(timedelta(hours=8)))\n    ref = str(demo_reference_date\
          \ or \"\").strip()\n    if ref:\n        reference = datetime.strptime(ref,\
          \ \"%Y-%m-%d\").date()\n        if reference.isoformat() != ref:\n     \
          \       raise ValueError(\"测试日期必须严格使用 YYYY-MM-DD。\")\n        clock_source\
          \ = \"TEST_OVERRIDE\"\n    else:\n        reference = now.date()\n     \
          \   clock_source = \"SYSTEM_CLOCK\"\n\n    raw = json.loads(cv_session or\
          \ \"{}\")\n    if not isinstance(raw, dict):\n        raise ValueError(\"\
          会话状态应为 JSON 对象。\")\n    if not raw:\n        state = {\"schema_version\"\
          : \"mvp1.2\", \"demo_case\": case, \"demo_anchor_date\": reference.isoformat(),\n\
          \                 \"flow_state\": \"IDLE\", \"draft\": {}, \"pending\":\
          \ [],\n                 \"last_question\": \"\", \"confirmation\": {},\n\
          \                 \"last_submission\": {}, \"history\": [], \"dialogue\"\
          : empty_dialogue()}\n    else:\n        expected = {\"schema_version\",\
          \ \"demo_case\", \"demo_anchor_date\", \"flow_state\", \"draft\", \"pending\"\
          ,\n                    \"last_question\", \"confirmation\", \"last_submission\"\
          , \"history\"}\n        legacy = raw.get(\"schema_version\") == \"mvp1.0\"\
          \n        if (legacy and set(raw) != expected) or (not legacy and (set(raw)\
          \ != expected | {\"dialogue\"} or raw.get(\"schema_version\") != \"mvp1.2\"\
          )):\n            raise ValueError(\"会话状态结构或版本不一致；不能自动清空。\")\n        if\
          \ raw[\"demo_case\"] != case:\n            raise ValueError(\"同一会话不能切换演示身份；请新建会话选择场景。\"\
          )\n        if raw[\"flow_state\"] not in {\"IDLE\", \"COLLECTING\", \"READY_TO_CONFIRM\"\
          , \"SUBMITTED\"}:\n            raise ValueError(\"会话状态非法。\")\n        for\
          \ key in (\"draft\", \"confirmation\", \"last_submission\"):\n         \
          \   if not isinstance(raw[key], dict):\n                raise ValueError(\"\
          会话对象损坏：\" + key)\n        for key in (\"pending\", \"history\"):\n     \
          \       if not isinstance(raw[key], list):\n                raise ValueError(\"\
          会话列表损坏：\" + key)\n        if not isinstance(raw[\"last_question\"], str):\n\
          \            raise ValueError(\"上一轮问题类型不正确。\")\n        state = raw\n  \
          \      if legacy:\n            state[\"schema_version\"] = \"mvp1.2\"\n\
          \            state[\"dialogue\"] = empty_dialogue()\n            if state[\"\
          flow_state\"] in {\"COLLECTING\", \"READY_TO_CONFIRM\"}:\n             \
          \   state[\"flow_state\"] = \"COLLECTING\"\n                state[\"confirmation\"\
          ] = {}\n                state[\"last_question\"] = \"已升级会话，请查看并核对当前确认单后继续。\"\
          \n\n    validate_dialogue(state[\"dialogue\"])\n    if state[\"dialogue\"\
          ][\"recovery\"] and state[\"flow_state\"] == \"READY_TO_CONFIRM\":\n   \
          \     raise ValueError(\"恢复事项尚未处理，不能处于待确认状态。\")\n\n    cities = [\n    \
          \    {\"place\": \"杭州\", \"name\": \"杭州\", \"code\": \"DEMO_HANGZHOU\",\
          \ \"aliases\": [\"杭州\", \"杭州市\", \"杭州东\", \"杭州东站\", \"萧山机场\"], \"mapped\"\
