          :\n            lines += [\"\", \"已先应用本轮修改，请核对这份新版内容。\"]\n        lines +=\
          \ [\"\", \"确认无误后，请单独回复 **确认提交**。需要修改时直接说明具体内容。\",\n                  \"\
          当前仅完成草稿检查，提交时还会进行模拟权限及历史行程校验。\"]\n    else:\n        lines += [\"\", \"\
          请先补充或处理：\"] + [str(i) + \". \" + esc(x[\"question\"]) for i, x in enumerate(questions,\
          \ 1)]\n        if len(checked[\"issues\"]) > 2:\n            shown = {x[\"\
          id\"] for x in questions}\n            lines += [\"\", \"其余待处理项：\" + \"\
          ；\".join(esc(x[\"question\"]) for x in checked[\"issues\"] if x[\"id\"]\
          \ not in shown)]\n        lines += [\"\", \"可以直接回答当前问题，也可以一次补充多项；已记录的信息会保留。\"\
