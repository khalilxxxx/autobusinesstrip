        code: "import copy\nimport hashlib\nimport json\nfrom datetime import datetime\n\
          \n\ndef main(state_json: str, plan_json: str, checked_json: str, context_json:\
          \ str) -> dict:\n    state, plan, checked, ctx = (json.loads(x) for x in\
          \ (state_json, plan_json, checked_json, context_json))\n    next_state =\
          \ copy.deepcopy(state)\n\n    def output(reply):\n        return {\"result_json\"\
          : json.dumps({\"state\": next_state, \"reply_text\": reply}, ensure_ascii=False,\
          \ separators=(\",\", \":\"))}\n\n    def reject(message):\n        return\
          \ output(\"当前未执行模拟创建，草稿已保留。\" + message)\n\n    def date(value):\n     \
          \   result = datetime.strptime(value, \"%Y-%m-%d\").date()\n        if result.isoformat()\
          \ != value:\n            raise ValueError(\"校验记录日期格式异常。\")\n        return\
          \ result\n\n    command = plan[\"query\"].strip().rstrip(\"。.!！\").strip()\n\
          \    if plan[\"action\"] != \"SUBMIT\" or command != \"确认提交\" or plan[\"\
          event\"][\"basic_updates\"] or plan[\"event\"][\"trip_operations\"]:\n \
          \       return reject(\"请先核对当前确认单，再单独回复“确认提交”。\")\n    draft = checked[\"\
          draft\"]\n    if state[\"dialogue\"][\"recovery\"] or checked[\"dialogue\"\
          ][\"recovery\"]:\n        return reject(\"还有上次尚未记录的内容，请先处理恢复问题，再核对确认单。\"\
          )\n    if not draft:\n        return reject(\"当前没有完整草稿，请先描述差旅安排。\")\n  \
          \  fingerprint = hashlib.sha256(json.dumps(draft, ensure_ascii=False, sort_keys=True,\
          \ separators=(\",\", \":\")).encode()).hexdigest()\n    last = state[\"\
          last_submission\"]\n    if state[\"flow_state\"] == \"SUBMITTED\":\n   \
          \     if last.get(\"draft_id\") == draft[\"draft_id\"] and last.get(\"revision\"\
          ) == draft[\"revision\"] and last.get(\"fingerprint\") == fingerprint:\n\
          \            return output(\"这张申请已模拟提交，本轮没有重复创建。\\n\\n\" + last[\"reply_text\"\
          ])\n        return reject(\"已提交记录与当前草稿不一致，请检查会话状态。\")\n    if state[\"flow_state\"\
          ] != \"READY_TO_CONFIRM\" or checked[\"issues\"] or checked[\"merge_error\"\
          ]:\n        return reject(\"申请尚有缺失或规则问题。请继续补充；也可以说“查看确认单”重新检查。\")\n    confirmed\
          \ = state[\"confirmation\"]\n    if (confirmed.get(\"draft_id\") != draft[\"\
          draft_id\"] or confirmed.get(\"revision\") != draft[\"revision\"]\n    \
          \        or confirmed.get(\"fingerprint\") != fingerprint):\n        question\
          \ = \"请回复“查看确认单”，核对当前版本后再提交。\"\n        next_state.update({\"flow_state\"\
          : \"COLLECTING\", \"confirmation\": {},\n                           \"pending\"\
          : [{\"id\": \"CONFIRMATION_STALE\", \"code\": \"CONFIRMATION_STALE\", \"\
          target\": \"\", \"field\": \"confirmation\", \"question\": question, \"\
          priority\": 0}],\n                           \"last_question\": question})\n\
          \        return reject(\"当前内容与最近展示的确认单不一致，请回复“查看确认单”，核对新版后再提交。\")\n    if\
          \ not ctx[\"can_submit\"]:\n        return reject(\"当前模拟用户没有提单权限。\")\n \
          \   if not ctx[\"check_available\"]:\n        return reject(\"模拟提单校验服务查询失败，不能按校验通过处理。\"\
          )\n    if not checked[\"date_start\"] or not checked[\"date_end\"]:\n  \
          \      return reject(\"无法确定整单出发与最终到达日期。\")\n    start, end = date(checked[\"\
          date_start\"]), date(checked[\"date_end\"])\n    if end < start:\n     \
          \   return reject(\"整单日期顺序不正确。\")\n    if len(state[\"history\"]) >= 50:\n\
          \        return reject(\"本演示会话已达到 50 张模拟记录上限；请保留记录后另开测试会话。\")\n    for record\
          \ in ctx[\"external_history\"] + state[\"history\"]:\n        if not isinstance(record,\
          \ dict) or not isinstance(record.get(\"blocking\"), bool):\n           \
          \ raise ValueError(\"模拟历史记录损坏，不能继续创建。\")\n        if record.get(\"applicant_id\"\
          ) != draft[\"applicant_id\"] or not record[\"blocking\"]:\n            continue\n\
          \        history_start, history_end = date(record[\"date_start\"]), date(record[\"\
          date_end\"])\n        if history_end < history_start:\n            raise\
          \ ValueError(\"模拟历史区间不合法。\")\n        if start < history_end and history_start\
          \ < end:\n            return reject(\"与已有模拟申请 \" + record[\"application_no\"\
          ] + \"（\" + record[\"date_start\"] + \"至\" + record[\"date_end\"] + \"）存在日期重叠，不能提单。\"\
          )\n        if max(start, history_start) == min(end, history_end):\n    \
          \        return reject(\"与已有申请日期端点同日相接，端点是否算重叠尚待业务明确，本 Demo 不自动放行。\")\n\
          \    token = hashlib.sha256((draft[\"draft_id\"] + \":\" + str(draft[\"\
          revision\"]) + \":\" + fingerprint).encode()).hexdigest()[:12].upper()\n\
          \    number = \"DEMO-CL-\" + ctx[\"reference_date\"].replace(\"-\", \"\"\
          ) + \"-\" + token\n    reply = \"### 模拟提交成功\\n\\n申请人：\" + draft[\"applicant_name\"\
          ] + \"\\n\\n模拟单号：**\" + number + \"**\\n\\n差旅日期：\" + checked[\"date_start\"\
          ] + \" 至 \" + checked[\"date_end\"] + \"\\n\\n这只是演示结果，没有调用报销系统，也没有创建真实单据。\"\
          \n    result = {\"demo_only\": \"Y\", \"application_no\": number, \"draft_id\"\
          : draft[\"draft_id\"],\n              \"revision\": draft[\"revision\"],\
          \ \"fingerprint\": fingerprint, \"reply_text\": reply,\n              \"\
          date_start\": checked[\"date_start\"], \"date_end\": checked[\"date_end\"\
          ],\n              \"demo_request\": {\"applicant_id\": draft[\"applicant_id\"\
          ], \"department\": draft[\"department\"],\n                            \
          \   \"payer_company\": draft[\"payer_company\"], \"travel_type\": draft[\"\
          travel_type\"],\n                               \"reason\": draft[\"reason\"\
          ], \"trips\": [\n                                   {\"from_city\": t[\"\
          resolved_from\"][\"code\"], \"to_city\": t[\"resolved_to\"][\"code\"],\n\
          \                                    \"depart_date\": t[\"depart_date\"\
          ][\"value\"], \"arrive_date\": t[\"arrive_date\"][\"value\"],\n        \
          \                            \"transport\": t[\"resolved_transport\"][\"\
          code\"]} for t in draft[\"trips\"]]}}\n    next_state[\"history\"].append({\"\
          applicant_id\": draft[\"applicant_id\"], \"application_no\": number,\n \
          \                                 \"date_start\": checked[\"date_start\"\
          ], \"date_end\": checked[\"date_end\"], \"blocking\": True})\n    next_state.update({\"\
          flow_state\": \"SUBMITTED\", \"draft\": draft, \"pending\": [], \"last_question\"\
          : \"\", \"last_submission\": result})\n    return output(reply)\n"
